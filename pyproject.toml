[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-video"
version = "1.6.0"
description = "电商 AI 视频生产流水线：知识库驱动 14 品类每镜精准注入 + 开放模型接入（custom 零代码）+ 批量生成，CLI 与 Python API 双入口"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ecommerce-video = "ecommerce_video.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ecommerce_video", "ecommerce_video.providers"]

[tool.setuptools.package-data]
ecommerce_video = ["prompt_gen_template.md", "knowledge/**/*.json", "knowledge/**/*.md", "knowledge/**/*.js", "knowledge/schema/*.json", "knowledge/raw/**/*.md", "knowledge/profiles/*.json", "knowledge/profiles/*.md"]
